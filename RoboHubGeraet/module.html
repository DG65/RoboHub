<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Symcon-Symbole (HTML-SDK-Doku „Icons"): Font Awesome mit Symcons Satz, Stil fa-light. Fehlt die Datei
     (fremde Seite), bleibt window.FontAwesome leer und die Kachel zeigt Emojis (Forum Thilo 26.10.2026). -->
<script src="/icons.js"></script>
<style>
:root{--fg:#1d1d1f;--fg2:#6e6e73;--rand:rgba(0,0,0,.12);--fl:rgba(0,0,0,.05);--seite:#ffffff;
--gruen:#1f7a3a;--gruenbg:#e3f4e8;--blau:#0b5cad;--blaubg:#e3effb;--gelb:#8a5a00;--gelbbg:#fbf0d9;--rot:#a82a2a;--rotbg:#fbe6e6;--grau:#6e6e73;--graubg:#efeff1;
--s:clamp(13px,calc(7px + 1.7vmin),22px)}
@media (prefers-color-scheme:dark){:root:not(.hell){--fg:#f2f2f7;--fg2:#a1a1a6;--rand:rgba(255,255,255,.16);--fl:rgba(255,255,255,.07);--seite:#1c1c1e;
--gruen:#7fd89a;--gruenbg:rgba(52,199,89,.18);--blau:#8cc4ff;--blaubg:rgba(10,132,255,.2);--gelb:#ffd479;--gelbbg:rgba(255,159,10,.2);--rot:#ff9b9b;--rotbg:rgba(255,69,58,.2);--grau:#a1a1a6;--graubg:rgba(255,255,255,.08)}}
:root.dunkel{--fg:#f2f2f7;--fg2:#a1a1a6;--rand:rgba(255,255,255,.16);--fl:rgba(255,255,255,.07);--seite:#1c1c1e;
--gruen:#7fd89a;--gruenbg:rgba(52,199,89,.18);--blau:#8cc4ff;--blaubg:rgba(10,132,255,.2);--gelb:#ffd479;--gelbbg:rgba(255,159,10,.2);--rot:#ff9b9b;--rotbg:rgba(255,69,58,.2);--grau:#a1a1a6;--graubg:rgba(255,255,255,.08)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:transparent;color:var(--fg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;font-size:var(--s)}
/* Symcon legt Instanzname + Vergrößern-Symbol als eigene Ebene über die
   oberen ~44 px der Kachel (Verbund-Befund NRGDashboard) — freihalten. */
body{padding:44px 16px 12px;display:flex;flex-direction:column}
#app{flex:1;display:flex;flex-direction:column}
body.eigen{background:var(--seite);padding-top:14px}
.layout{display:grid;gap:1.1em;align-items:start;margin-top:.4em;width:100%;grid-template-areas:"links" "karte" "rechts"}
.links{grid-area:links}.rechts{grid-area:rechts}.kartenfeld{grid-area:karte}
/* Mittelbreit: Karte unter dem Status (links), schmal gehalten. Breit: eigene Spalte in der Mitte. */
@media (min-width:560px){.layout{grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);grid-template-areas:"links rechts" "karte rechts";gap:1.1em 1.6em}}
@media (min-width:900px){.layout.mitkarte{grid-template-columns:minmax(0,1fr) minmax(0,1.1fr) minmax(0,1.2fr);grid-template-areas:"links karte rechts"}}
.status{display:flex;align-items:center;gap:.9em}
.sym{width:3.6em;height:3.6em;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1em;flex:none}
.sym span{font-size:2.1em;line-height:1}
.svg-inline--fa{vertical-align:-.125em}
.geraet{position:relative;width:5.4em;height:5.4em;flex:none;border-radius:1.1em;border:.18em solid;background:var(--fl);display:flex;align-items:center;justify-content:center}
.geraet img{max-width:92%;max-height:92%;object-fit:contain}
.geraet .marke{position:absolute;right:-.45em;bottom:-.45em;width:1.9em;height:1.9em;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.85em;border:.15em solid var(--seite)}
.titel{min-width:0}.titel b{display:block;font-size:1.45em;font-weight:600;line-height:1.2}
.titel span{display:block;font-size:.85em;color:var(--fg2);margin-top:.15em}
.akku{margin:1em 0 .2em;display:flex;align-items:center;gap:.7em}
.balken{flex:1;height:.55em;border-radius:1em;background:var(--graubg);overflow:hidden}
.balken i{display:block;height:100%;border-radius:1em}
.akku b{font-size:1.1em;font-weight:600;min-width:3.6em;text-align:right}
.akku span{font-size:.8em;color:var(--fg2)}
.hinweis{border-radius:.7em;padding:.55em .8em;margin-top:.7em;font-size:.9em}
.knoepfe{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.5em;margin-top:1em;max-width:26em}
@media (max-width:559px){.knoepfe{grid-template-columns:repeat(4,minmax(0,1fr));max-width:none}}
button{font:inherit;font-size:.92em;color:var(--fg);background:var(--fl);border:1px solid var(--rand);border-radius:.8em;padding:.6em .3em;cursor:pointer;white-space:nowrap}
button:active{transform:scale(.97)}
button:disabled{opacity:.45;cursor:default}
.start{background:var(--blaubg);border-color:transparent;color:var(--blau)}
.abschnitt{font-size:.78em;color:var(--fg2);text-transform:uppercase;letter-spacing:.06em;margin:0 0 .5em}
.block+.block{margin-top:1.1em}
.chips{display:flex;flex-wrap:wrap;gap:.45em}
.chip{font-size:.9em;padding:.35em .9em;border-radius:2em;border:1px solid var(--rand);background:transparent}
.chip.an{background:var(--blaubg);border-color:var(--blau);color:var(--blau)}
.los{margin-top:.6em;width:100%}
.raumeinst{font-size:.8em;color:var(--fg2);margin-top:.35em}
.startzeile{display:flex;flex-wrap:wrap;gap:.4em;margin-top:.6em}
.startwahl{font:inherit;font-size:.85em;color:var(--fg);background:var(--fl);border:1px solid var(--rand);border-radius:.7em;padding:.35em .5em;max-width:100%}
.info{display:flex;flex-wrap:wrap;gap:.45em}.info span{font-size:.85em;padding:.3em .8em;border-radius:2em;background:var(--graubg)}
.teil{display:flex;justify-content:space-between;gap:.6em;font-size:.92em;padding:.28em 0;border-bottom:1px solid var(--rand)}
.teil:last-of-type{border-bottom:none}
.teil.rot{color:var(--rot)}.teil.gelb{color:var(--gelb)}.teil.ok{color:var(--fg2)}
.mini{font-size:.78em;padding:.15em .55em;margin-left:.4em;border-radius:.6em}
.mini.ja{background:var(--rotbg);color:var(--rot);border-color:transparent}
.teil.aus{color:var(--fg2);opacity:.75}
.mini.aus{background:transparent;color:var(--fg2)}
.mehr{background:none;border:none;color:var(--blau);padding:.4em 0;font-size:.88em}
.fuss{margin-top:auto;padding-top:.8em;font-size:.75em;color:var(--fg2)}
.meldung{font-size:.85em;color:var(--fg2);margin-top:.6em;min-height:1.2em}
.karte{border-radius:.8em;background:var(--fl);padding:.5em}
.flaeche{position:relative;margin:0 auto;max-width:100%}
.flaeche img{display:block;width:100%;height:auto}
.ort{position:absolute;transform:translate(-50%,-50%);font-size:.72em;padding:.15em .55em;border-radius:1em;border:1px solid var(--rand);background:var(--seite);opacity:.92;color:var(--fg);white-space:nowrap;cursor:default}
button.ort{cursor:pointer}
.ort.an{background:var(--blau);color:var(--seite);border-color:var(--blau);opacity:1}
.dock{position:absolute;transform:translate(-50%,-50%);font-size:.9em;line-height:1;pointer-events:none}
/* Größere Tippfläche um die Raumnamen, ohne sie größer zu zeichnen (Forum power1625 144636/68: „oft passiert nichts"). */
button.ort{touch-action:manipulation}
/* Raumnamen über Fahrweg und Roboterpunkt (Forum 144636/74: „WC“/„Flur“ verdeckt). */
.ort{z-index:2}
button.ort::before{content:'';position:absolute;inset:-.55em -.35em}
/* Farbschema nicht erkennbar: eigener Hintergrund, damit Text immer lesbar bleibt (Forum 144636/68). */
body.eigenbg{background:var(--seite);border-radius:12px}
.weg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.weg polyline{fill:none;stroke:#3a6fd8;stroke-width:1.6;stroke-linejoin:round;stroke-linecap:round;opacity:.75}
.robo{position:absolute;width:1.15em;height:1.15em;margin:-.575em 0 0 -.575em;border-radius:50%;background:#1f5fd1;border:.15em solid #fff;box-shadow:0 0 0 .25em rgba(31,95,209,.28);pointer-events:none}
.robo i{position:absolute;left:50%;top:-.45em;width:0;height:0;margin-left:-.25em;border:.25em solid transparent;border-bottom:.32em solid #fff}
.namen{display:block;margin:.35em auto 0;background:none;border:none;color:var(--fg2);font-size:.72em;padding:.2em .4em}
.livemarke{font-size:.72em;color:var(--fg2);margin-top:.35em;text-align:center}
</style>
</head>
<body>
<div id="app"></div>
<script>
// Zustand: [Emoji, Farbe, Symcon-Symbol]
var ZUSTAND = {
  '-1': ['❔', 'grau', 'circle-question'], 0: ['🤖', 'gruen', 'vacuum-robot'], 1: ['🧹', 'blau', 'broom'], 2: ['⏸️', 'gelb', 'pause'],
  3: ['↩️', 'blau', 'arrow-turn-left'], 4: ['🔋', 'gruen', 'battery-bolt'], 5: ['🏠', 'gruen', 'house'], 6: ['💧', 'gruen', 'droplet'],
  7: ['⚠️', 'rot', 'triangle-exclamation'], 8: ['💤', 'grau', 'moon'], 9: ['🗺️', 'blau', 'map'], 10: ['🔄', 'grau', 'arrows-rotate'],
  11: ['🌧️', 'gelb', 'cloud-rain']
};
// Führendes Emoji in Texten aus dem Modul (Rückmeldungen, Hinweise, Überblick) → Symcon-Symbol.
var EMOJI_SYMBOL = {
  '⛔': 'circle-xmark', '✅': 'circle-check', 'ℹ️': 'circle-info', 'ℹ': 'circle-info', '⚠️': 'triangle-exclamation', '⚠': 'triangle-exclamation',
  '📤': 'paper-plane', '🔒': 'lock', '🚰': 'faucet', '🪣': 'bucket', '🗑️': 'trash-can', '🗑': 'trash-can', '🧴': 'bottle-droplet',
  '🌙': 'moon', '🔔': 'bell', '🔇': 'volume-xmark', '🔊': 'volume-high', '🌧️': 'cloud-rain', '🌧': 'cloud-rain', '☀️': 'sun', '☀': 'sun',
  '🧹': 'broom', '⏸️': 'circle-pause', '⏸': 'circle-pause', '🗓️': 'calendar-days', '🗓': 'calendar-days', '⏳': 'hourglass',
  '📧': 'envelope', '🔄': 'arrows-rotate', '🔌': 'plug', '🔑': 'key', '🗺️': 'map', '🗺': 'map', '🏠': 'house', '📍': 'location-dot', '⚡': 'bolt'
};
function mitIcons() { return !!(daten && daten.symbole !== 1 && window.FontAwesome); }
// Symbol: Symcon-Icon oder Emoji (Einstellung „Symbole in der Kachel", Rückfall Emoji ohne icons.js).
function sym(icon, emoji) { return mitIcons() ? '<i class="fa-light fa-' + icon + '" aria-hidden="true"></i>' : emoji; }
// Text (wird escaped); ein bekanntes Emoji am Anfang wird zum Symbol.
function textSym(t) {
  t = String(t == null ? '' : t);
  for (var e in EMOJI_SYMBOL) {
    if (t.indexOf(e) === 0) { return sym(EMOJI_SYMBOL[e], e) + ' ' + esc(t.slice(e.length).replace(/^\uFE0F?\s*/, '')); }
  }
  return esc(t);
}
// Farbstufen der Verbrauchsteile, angelehnt an die Hersteller-Apps
// (Dietmars Screenshots 11.10.2026): Dreamehome färbt nur 0 % rot,
// MOVAhome nennt 34 % „Bald ersetzen" und 72 % „In gutem Zustand".
var TEIL_ROT = 5, TEIL_GELB = 35;
// Befehle: [Wert, Symcon-Symbol, Emoji, Text]
var BEFEHLE = [[1, 'play', '▶️', 'Start'], [2, 'pause', '⏸️', 'Pause'], [4, 'house', '🏠', 'Station'], [5, 'location-dot', '📍', 'Locate']];
var daten = null, gewaehlt = [], alleTeile = false, rueck = '', bildFehlt = false, rueckfrage = '';
// Läuft ein Befehl, sind die Befehlsknöpfe gesperrt: der Roboter nimmt (z. B. iRobot) nur eine
// Verbindung an, ein zweiter Klick lief sonst in einen Fehler (Forum Thilo 24.10.2026).
var befehlLaeuft = false, befehlUhr = null;
// Startwerte wie das „benutzerdefiniert"-Fenster der App, −1 = wie eingestellt.
var startModus = -1, startSaug = -1, startDurch = -1;
function auswahl(name, wert, optionen) {
  return '<select class="startwahl" onchange="' + name + '=Number(this.value)">' + optionen.map(function (o) {
    return '<option value="' + o[0] + '"' + (o[0] === wert ? ' selected' : '') + '>' + o[1] + '</option>';
  }).join('') + '</select>';
}

// Texte: englischer Schlüssel, Übersetzung liefert das Modul in daten.texte (locale.json); %s = Wert.
function T(s, a) { var t = (daten && daten.texte && daten.texte[s]) || s; return a == null ? t : t.replace('%s', a); }
function deutsch() { return T('language code: en') === 'de'; }

function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return {'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]; }); }
function farbe(n) { return 'background:var(--' + n + 'bg);color:var(--' + n + ')'; }

// Kachel: requestAction() der Visualisierung (deren Anmeldung gilt).
// Eigenständige Seite (IPSView/Browser): nur mit Schlüssel, per WebHook.
function senden(ident, wert, text) {
  if (befehlLaeuft) { return; }
  befehlLaeuft = true;
  clearTimeout(befehlUhr);
  befehlUhr = setTimeout(function () { befehlLaeuft = false; zeichnen(); }, 40000);   // Sicherheitsnetz
  rueck = '📤 ' + T('%s sent …', text); zeichnen();
  if (!daten.eigen && typeof requestAction === 'function') { requestAction(ident, wert); return; }
  fetch(daten.hook + '?cmd=' + encodeURIComponent(ident) + '&wert=' + encodeURIComponent(wert) + '&key=' + encodeURIComponent(daten.key || ''))
    .then(function (r) { return r.json(); })
    .then(function (j) { befehlLaeuft = false; rueck = j.text || (j.ok ? '📤 ' + T('sent') : '⛔ ' + T('rejected')); zeichnen(); })
    .catch(function () { befehlLaeuft = false; rueck = '⛔ ' + T('No connection to Symcon'); zeichnen(); });
}

// Raumnamen im Kartenbild: Vorgabe aus dem Formular, in der Kachel pro Gerät umschaltbar
// (Forum power1625 144636/70: „Schalter wäre besser in der Kachel aufgehoben"). Gemerkt im Browser
// des Geräts — so kann das Handy ohne, das Tablet mit Namen zeigen.
function namenZeigen() {
  try { var v = localStorage.getItem('robohub-namen-' + (daten && daten.id)); if (v === '0' || v === '1') { return v === '1'; } } catch (e) { /* kein Speicher */ }
  return !(daten && daten.kartenNamen === false);
}
function namenUmschalten() {
  var neu = !namenZeigen();
  try { localStorage.setItem('robohub-namen-' + (daten && daten.id), neu ? '1' : '0'); } catch (e) { /* nur bis zum Neuladen */ if (daten) { daten.kartenNamen = neu; } }
  zeichnen();
}

function raumWaehlen(id) {
  var i = gewaehlt.indexOf(id);
  if (i >= 0) { gewaehlt.splice(i, 1); } else { gewaehlt.push(id); }
  zeichnen();
}

function zeichnen() {
  var d = daten; if (!d) { return; }
  var z = ZUSTAND[d.zustand] || ZUSTAND['-1'];
  var bedienbar = !d.eigen || d.bedienung;
  var akkuFarbe = d.akku == null ? 'grau' : (d.akku <= 15 ? 'rot' : (d.akku <= 35 ? 'gelb' : 'gruen'));

  var symbol = d.klasse === 'maeher' && d.zustand === 1 ? sym('seedling', '🌱') : sym(z[2], z[0]);
  // Produktbild des Herstellers mit Zustandsring + Zustandssymbol; ohne Bild
  // (oder wenn es nicht lädt) wie bisher nur das Symbol im Farbkreis.
  var l = '<div class="status">';
  if (d.bild && !bildFehlt) {
    l += '<div class="geraet" style="border-color:var(--' + z[1] + ')"><img src="' + esc(d.bild) + '" alt="" onerror="bildFehlt=true;zeichnen()">'
      + '<div class="marke" style="' + farbe(z[1]) + '">' + symbol + '</div></div>';
  } else {
    l += '<div class="sym" style="' + farbe(z[1]) + '"><span>' + symbol + '</span></div>';
  }
  l += '<div class="titel"><b>' + esc(d.zustandText) + '</b>' + (d.unterzeile ? '<span>' + esc(d.unterzeile) + '</span>' : '') + '</div></div>';
  l += '<div class="akku"><div class="balken"><i style="width:' + (d.akku || 0) + '%;background:var(--' + akkuFarbe + ')"></i></div>';
  l += '<b>' + (d.akku == null ? '–' : d.akku + ' %') + '</b><span>' + (d.laedt ? sym('bolt', '⚡') + ' ' + T('charging') : sym('battery-full', '🔋')) + '</span></div>';
  if (!d.erreichbar) { l += '<div class="hinweis" style="' + farbe('grau') + '">' + sym('wifi-slash', '📡') + ' ' + T('Currently not reachable') + '</div>'; }
  if (d.fehler) { l += '<div class="hinweis" style="' + farbe('rot') + '">' + sym('triangle-exclamation', '⚠️') + ' ' + esc(d.fehler) + '</div>'; }
  (d.hinweise || []).forEach(function (t) { l += '<div class="hinweis" style="' + farbe('gelb') + '">' + textSym(t) + '</div>'; });
  if (bedienbar) {
    l += '<div class="knoepfe">';
    BEFEHLE.forEach(function (b) {
      l += '<button' + (b[0] === d.hauptknopf ? ' class="start"' : '') + (befehlLaeuft ? ' disabled' : '') + ' onclick="senden(\'Befehl\',' + b[0] + ',\'' + T(b[3]) + '\')">' + sym(b[1], b[2]) + ' ' + T(b[3]) + '</button>';
    });
    l += '</div>';
  } else if (d.eigen) {
    l += '<div class="hinweis" style="' + farbe('grau') + '">' + sym('lock', '🔒') + ' ' + T('Display only — control not enabled for this page') + '</div>';
  }
  l += '<div class="meldung">' + textSym(rueck) + '</div>';

  // Kartenbild: Räume/Zonen als Namen darüber, antippen = auswählen (wie die Knöpfe rechts).
  var k = d.karte, kt = '';
  if (k && k.bild) {
    var hoch = 14; // em — sehr hohe Karten nicht über die Kachel hinaus wachsen lassen
    kt = '<div class="karte"><div class="flaeche" style="width:min(100%,' + (hoch * (k.format || 1)).toFixed(1) + 'em)"><img src="' + esc(k.bild) + '" alt="' + T('Map') + '">';
    (namenZeigen() ? (k.marken || []) : []).forEach(function (m) {
      var an = gewaehlt.indexOf(m.id) >= 0 ? ' an' : '';
      kt += bedienbar
        ? '<button class="ort' + an + '" style="left:' + m.x + '%;top:' + m.y + '%" onclick="raumWaehlen(' + Number(m.id) + ')">' + esc(m.name) + '</button>'
        : '<span class="ort" style="left:' + m.x + '%;top:' + m.y + '%">' + esc(m.name) + '</span>';
    });
    if (k.station) { kt += '<span class="dock" style="left:' + k.station.x + '%;top:' + k.station.y + '%" title="' + T('Station') + '">' + sym('charging-station', '⚡') + '</span>'; }
    // Gefahrener Weg (Stücke in %) als Linie über dem Bild, Roboter als Punkt mit Blickrichtung.
    if ((k.weg || []).length) {
      kt += '<svg class="weg" viewBox="0 0 100 100" preserveAspectRatio="none">';
      k.weg.forEach(function (s) { kt += '<polyline vector-effect="non-scaling-stroke" points="' + s.map(function (p) { return Number(p[0]) + ',' + Number(p[1]); }).join(' ') + '"/>'; });
      kt += '</svg>';
    }
    if (k.roboter) {
      // Kartenwinkel: 0° = +x (rechts), gegen den Uhrzeigersinn; Bild-y ist gespiegelt → im Bild im Uhrzeigersinn drehen.
      kt += '<span class="robo" style="left:' + Number(k.roboter.x) + '%;top:' + Number(k.roboter.y) + '%;transform:rotate(' + (90 - Number(k.roboter.winkel || 0)) + 'deg)"><i></i></span>';
    }
    kt += '</div>';
    if ((k.marken || []).length) { kt += '<button class="namen" title="' + T('Room names in the map') + '" onclick="namenUmschalten()">' + sym('map', '🗺️') + ' ' + T(namenZeigen() ? 'Hide names' : 'Show names') + '</button>'; }
    if (k.live) { kt += '<div class="livemarke">' + sym('satellite-dish', '🛰️') + ' ' + T('Live · %s', new Date(k.live * 1000).toLocaleTimeString(deutsch() ? 'de-DE' : 'en-GB', {hour: '2-digit', minute: '2-digit'})) + '</div>'; }
    kt += '</div>';
  }

  var r = '';
  if (bedienbar && (d.raeume || []).length) {
    r += '<div class="block"><p class="abschnitt">' + T(d.klasse === 'maeher' ? 'Mow zone' : 'Clean room') + '</p><div class="chips">';
    d.raeume.forEach(function (x) { r += '<button class="chip' + (gewaehlt.indexOf(x.id) >= 0 ? ' an' : '') + '"' + (x.info ? ' title="' + esc(x.info) + '"' : '') + ' onclick="raumWaehlen(' + x.id + ')">' + esc(x.name) + '</button>'; });
    // Einstellungen der gewählten Räume (aus der App) unter den Knöpfen — so sieht man vor dem Start, was passiert.
    d.raeume.filter(function (x) { return gewaehlt.indexOf(x.id) >= 0 && x.info; }).forEach(function (x) {
      r += '<div class="raumeinst">' + esc(x.name) + ': ' + esc(x.info) + '</div>';
    });
    r += '</div>';
    if (gewaehlt.length) {
      var namen = d.raeume.filter(function (x) { return gewaehlt.indexOf(x.id) >= 0; }).map(function (x) { return x.name; }).join(', ');
      var wert = gewaehlt.join(',');
      if (d.klasse !== 'maeher') {
        var wahl = d.startWahl || {};
        r += '<div class="startzeile">'
          + ((wahl.modus || []).length ? auswahl('startModus', startModus, [[-1, T('Mode as set')]].concat(wahl.modus)) : '')
          + ((wahl.saug || []).length ? auswahl('startSaug', startSaug, [[-1, T('Suction level as set')]].concat(wahl.saug)) : '')
          + auswahl('startDurch', startDurch, [[-1, '1×'], [2, '2×'], [3, '3×']]) + '</div>';
        wert += '|' + startModus + '|' + startSaug + '|' + startDurch;
      }
      r += '<button class="start los" onclick="senden(\'Raeume\',\'' + wert + '\',\'' + T(d.klasse === 'maeher' ? 'Mowing %s' : 'Cleaning %s', esc(namen).replace(/'/g, '')) + '\');gewaehlt=[];">' + sym('play', '▶️') + ' ' + T(d.klasse === 'maeher' ? 'Mow %s' : 'Clean %s', esc(namen)) + '</button>';
    }
    r += '</div>';
  }
  if ((d.zeitplaene || []).length) {
    r += '<div class="block"><p class="abschnitt">' + T('Schedules') + '</p>';
    d.zeitplaene.forEach(function (t) {
      var knopf = bedienbar && t.schaltbar
        ? ' <button class="mini' + (t.an ? '' : ' aus') + '" onclick="senden(\'Zeitplan\',\'' + Number(t.id) + ':' + (t.an ? 0 : 1) + '\',\'' + T(t.an ? 'Schedule off' : 'Schedule on') + '\')">' + T(t.an ? 'on' : 'off') + '</button>'
        : '';
      r += '<div class="teil ' + (t.an ? 'ok' : 'aus') + '"><span>' + (t.an ? sym('calendar-days', '🗓️') : sym('circle-pause', '⏸️')) + ' ' + textSym(t.text) + '</span><span>' + knopf + '</span></div>';
    });
    r += '</div>';
  }
  if ((d.info || []).length) {
    r += '<div class="block"><p class="abschnitt">' + T('Overview') + '</p><div class="info">' + d.info.map(function (t) { return '<span>' + textSym(t) + '</span>'; }).join('') + '</div></div>';
  }
  var teile = (d.teile || []).slice().sort(function (a, b) { return a.prozent - b.prozent; });
  if (teile.length) {
    var kritisch = teile.filter(function (t) { return t.prozent <= TEIL_GELB; });
    // Bis zu 4 Teile (z. B. Mäher) passen immer — dann nichts einklappen.
    var offen = alleTeile || teile.length <= 4;
    var zeigen = offen ? teile : kritisch;
    r += '<div class="block"><p class="abschnitt">' + T('Consumables') + '</p>';
    zeigen.forEach(function (t) {
      var k = t.prozent <= TEIL_ROT ? 'rot' : (t.prozent <= TEIL_GELB ? 'gelb' : 'ok');
      // Zurücksetzen nur in zwei Schritten (↺ → „Wirklich?" → Ja), nicht rückgängig zu machen.
      var aktion = '';
      if (bedienbar && t.id) {
        aktion = rueckfrage === t.id
          ? ' <button class="mini ja" onclick="rueckfrage=\'\';senden(\'Zuruecksetzen\',\'' + t.id + '\',\'' + T('Reset %s', esc(t.name).replace(/'/g, '')) + '\')">' + T('Yes, reset') + '</button><button class="mini" onclick="rueckfrage=\'\';zeichnen()">' + T('No') + '</button>'
          : ' <button class="mini" title="' + T('Reset after replacing/cleaning') + '" onclick="rueckfrage=\'' + t.id + '\';zeichnen()">' + sym('rotate-left', '↺') + '</button>';
      }
      r += '<div class="teil ' + k + '"><span>' + (k === 'rot' ? sym('triangle-exclamation', '⚠️') + ' ' : '') + esc(t.name) + '</span><span>' + t.prozent + ' %' + (t.stunden == null ? '' : ' · ' + (deutsch() ? String(t.stunden).replace('.', ',') : String(t.stunden)) + ' h') + aktion + '</span></div>';
    });
    var rest = teile.length - kritisch.length;
    if (!offen && rest > 0) { r += '<button class="mehr" onclick="alleTeile=true;zeichnen()">' + T(kritisch.length ? '%s more OK' : 'All %s OK', rest) + ' ›</button>'; }
    if (alleTeile && teile.length > 4) { r += '<button class="mehr" onclick="alleTeile=false;zeichnen()">‹ ' + T('less') + '</button>'; }
    r += '</div>';
  }
  var f = d.stand ? '<div class="fuss">' + T('As of %s', esc(d.stand)) + '</div>' : '';
  document.getElementById('app').innerHTML = '<div class="layout' + (kt ? ' mitkarte' : '') + '"><div class="links">' + l + '</div>'
    + (kt ? '<div class="kartenfeld">' + kt + '</div>' : '') + '<div class="rechts">' + r + '</div></div>' + f;
}

// Farbschema der Visualisierung: Symcons html-sdk.js (/usr/share/symcon/tile, in jede Kachel
// eingebunden) setzt aus den URL-Parametern der App bzw. des Browsers CSS-Variablen auf :root —
// u. a. --card-color (Kartenhintergrund) und --content-color (Text). In der HTML-SDK-Doku steht das
// nicht; gefunden 13.11.2026 (Forum power1625 144636/70: Rahmen-Messung lag im Web und in der App falsch).
// Reihenfolge: Symcon-Kartenfarbe → Symcon-Textfarbe → Rahmen messen → Gerätefarbe mit eigenem Hintergrund.
function symconSchema() {
  try {
    var cs = getComputedStyle(document.documentElement);
    var karte = helligkeit(cs.getPropertyValue('--card-color'));
    if (karte !== null) { return karte < 0.5 ? 'dunkel' : 'hell'; }
    var text = helligkeit(cs.getPropertyValue('--content-color'));
    if (text !== null) { return text > 0.5 ? 'dunkel' : 'hell'; }
  } catch (e) { /* ohne Symcon-Variablen */ }
  return '';
}
// '#rrggbb', '#rgb' oder 8-stellig. Symcon reicht Flutter-Farben weiter; beginnt ein 8-stelliger Wert
// mit „ff", ist er als AARRGGBB gemeint (deckend), sonst als RRGGBBAA gelesen.
function helligkeit(wert) {
  var h = String(wert || '').trim().replace(/^#/, '');
  if (!/^[0-9a-f]+$/i.test(h)) { return null; }
  if (h.length === 3) { h = h.replace(/(.)/g, '$1$1'); }
  if (h.length === 8) { h = /^ff/i.test(h) ? h.slice(2) : h.slice(0, 6); }
  if (h.length !== 6) { return null; }
  var r = parseInt(h.slice(0, 2), 16), g = parseInt(h.slice(2, 4), 16), b = parseInt(h.slice(4, 6), 16);
  return (0.299 * r + 0.587 * g + 0.114 * b) / 255;
}
function farbschemaSetzen(wahl) {
  var erkannt = symconSchema() || hintergrundSchema();
  var s = wahl === 1 ? 'hell' : (wahl === 2 ? 'dunkel' : erkannt);
  document.documentElement.classList.toggle('hell', s === 'hell');
  document.documentElement.classList.toggle('dunkel', s === 'dunkel');
  // Eigener Hintergrund, wenn die Schrift sonst nicht zum Untergrund passt: Schema unbekannt (Gerätefarbe
  // muss nicht zur Visualisierung passen, Forum 144636/68) oder festes Hell/Dunkel gegen das erkannte
  // Schema (Forum 144636/70: „hell" in der dunklen App → dunkle Schrift auf Dunkel). Immer lesbar.
  document.body.classList.toggle('eigenbg', !(daten && daten.eigen) && (s === '' || (erkannt !== '' && s !== erkannt)));
}
function hintergrundSchema() {
  try {
    var el = window.frameElement;
    while (el) {
      var m = getComputedStyle(el).backgroundColor.match(/[\d.]+/g);
      if (m && (m.length < 4 || Number(m[3]) > 0.5)) {
        var hell = (0.299 * m[0] + 0.587 * m[1] + 0.114 * m[2]) / 255;
        return hell < 0.5 ? 'dunkel' : 'hell';
      }
      el = el.parentElement;
    }
  } catch (e) { /* fremder Rahmen: nicht lesbar */ }
  return '';
}

function handleMessage(raw) {
  var neu = typeof raw === 'string' ? JSON.parse(raw) : raw;
  if (neu.rueck) { rueck = neu.rueck; befehlLaeuft = false; } else if (daten && neu.stand !== daten.stand) { rueck = ''; }
  // Aktualisierungen kommen ohne Texte (spart Übersetzungen je Echtzeit-Meldung) — die vom Aufbau behalten.
  if (!neu.texte && daten && daten.texte) { neu.texte = daten.texte; }
  daten = neu;
  document.documentElement.lang = deutsch() ? 'de' : 'en';
  if (daten.eigen) { document.body.className = 'eigen'; }
  farbschemaSetzen(daten.farbschema || 0);
  zeichnen();
}
</script>
